<script>
  const tl = gsap.timeline({ paused: true });
  const W = (sel) => document.querySelectorAll(sel);

  // Teléfono: llega lento (cola larga) y queda quieto; lo que se mueve es la interfaz.
  tl.fromTo("#ph-wrap", {y:900}, {y:0, duration:.85, ease:"expo.out"}, 0);

  // Cámara: deriva vertical lenta y continua mientras el teléfono está en cuadro (ningún cuadro queda igual).
  tl.fromTo("#ph-cam", {y:0}, {y:30, duration:11.0, ease:"none"}, .5);
  // La pantalla bloqueada: la luz del fondo se corre despacio (el mundo detrás se mueve).
  tl.fromTo("#ph-lock", {backgroundPosition:"0% 0%"}, {backgroundPosition:"0% 100%", duration:3.4, ease:"none"}, .4);
  // El ícono (Porty) parpadea mientras la notificación espera.
  tl.to("#ph-icon svg", {scaleY:.9, duration:.08, yoyo:true, repeat:1, ease:"power1.inOut"}, 2.2);

  // Titular 2: palabra por palabra con desenfoque.
  tl.fromTo("#ph-t2 .w", {opacity:0, filter:"blur(6px)"}, {opacity:1, filter:"blur(0px)", duration:.13, stagger:.067, ease:"power2.out"}, .45)
    .to("#ph-t2 .w", {opacity:0, filter:"blur(8px)", duration:.15, stagger:.025, ease:"power2.in"}, 3.85);

  // Porty llega al ícono (match con la escena anterior) y la notificación crece desde él.
  tl.fromTo("#ph-notif", {opacity:0}, {opacity:1, duration:.01}, .68)
    .fromTo("#ph-notif", {clipPath:"inset(0px 480px 0px 0px round 34px)"}, {clipPath:"inset(0px 0px 0px 0px round 34px)", duration:.42, ease:"power3.out"}, .78)
    .fromTo("#ph-icon", {scale:1.18}, {scale:1, duration:.32, ease:"back.out(2)"}, .7)
    .fromTo("#ph-ntext", {opacity:0, filter:"blur(6px)"}, {opacity:1, filter:"blur(0px)", duration:.16, ease:"power2.out"}, .98);

  // Toque: la notificación se hunde y vuelve (sin anillos de click).
  tl.to("#ph-notif", {scale:.965, duration:.11, ease:"power2.in"}, 3.4)
    .to("#ph-notif", {scale:1, duration:.2, ease:"power2.out"}, 3.51);

  // La notificación se vuelve la pantalla del chat (objeto que se vuelve el mundo).
  tl.fromTo("#ph-chat", {clipPath:"inset(300px 18px 260px 18px round 34px)", opacity:0},
                        {clipPath:"inset(0px 0px 0px 0px round 0px)", opacity:1, duration:.65, ease:"power2.inOut"}, 3.62)
    .to("#ph-lock", {filter:"blur(15px)", opacity:0, duration:.3, ease:"power2.in"}, 3.68);

  // Titular 3: de gris a tinta, palabra por palabra, sin moverse.
  tl.fromTo("#ph-t3 .w", {opacity:0}, {opacity:1, duration:.01, stagger:.085}, 4.25)
    .fromTo("#ph-t3 span.w", {color:"#D2D0CC"}, {color:"#2F3437", duration:.12, stagger:.085, ease:"none"}, 4.25)
    .fromTo("#ph-t3 em.w", {color:"#EBD3C2"}, {color:"#C27443", duration:.12, stagger:.085, ease:"none"}, 4.25 + .085*5)
    .to("#ph-t3 .w", {opacity:0, filter:"blur(8px)", duration:.15, stagger:.025, ease:"power2.in"}, 7.25);

  // Chat: pregunta, "escribiendo…", respuesta palabra por palabra.
  tl.fromTo("#ph-q", {opacity:0, y:24}, {opacity:1, y:0, duration:.45, ease:"expo.out"}, 4.45)
    .fromTo("#ph-dots", {opacity:0, y:16}, {opacity:1, y:0, duration:.3, ease:"expo.out"}, 4.85);
  W("#ph-dots i").forEach((d, i) => {
    tl.fromTo(d, {y:0}, {y:-8, duration:.16, ease:"sine.inOut", yoyo:true, repeat:3}, 4.95 + i * .1);
  });
  tl.to("#ph-dots", {opacity:0, duration:.12, ease:"power1.in"}, 5.5)
    .fromTo("#ph-a", {opacity:0, y:18}, {opacity:1, y:0, duration:.4, ease:"expo.out"}, 5.55)
    .fromTo("#ph-a .w", {opacity:0, filter:"blur(4px)"}, {opacity:1, filter:"blur(0px)", duration:.14, stagger:.08, ease:"power2.out"}, 5.6)
  // La parte de tecnología se marca mientras se lee.
    .fromTo("#ph-a .tec", {color:"#2F3437"}, {color:"#A95F33", duration:.3, ease:"power2.out"}, 6.9);

  // Titular 4: la línea entera entra desenfocada.
  tl.fromTo("#ph-t4", {opacity:0, filter:"blur(8px)"}, {opacity:1, filter:"blur(0px)", duration:.2, ease:"power2.out"}, 7.45)
    .to("#ph-t4", {opacity:0, filter:"blur(8px)", duration:.18, ease:"power2.in"}, 11.45);

  // La conversación sigue: sube y llega la tarjeta de composición como mensaje de Porty.

    .to("#ph-q", {opacity:0, duration:.3, ease:"power2.in"}, 7.25)
    .fromTo("#ph-card", {opacity:0, y:90}, {opacity:1, y:0, duration:.7, ease:"expo.out"}, 7.35)
    .fromTo("#ph-card .bar span", {scaleX:0}, {scaleX:1, duration:.75, stagger:.14, ease:"power2.inOut"}, 7.9);
  W("#ph-card .p").forEach((el, i) => {
    const o = {v:0}, to = +el.dataset.to;
    tl.fromTo(o, {v:0}, {v:to, duration:.75, ease:"power2.inOut", onUpdate:() => { el.textContent = Math.round(o.v) + "%"; }}, 7.9 + i * .14);
  });
  tl.fromTo("#ph-flag", {opacity:0, y:14}, {opacity:1, y:0, duration:.45, ease:"expo.out"}, 8.95)
    .fromTo("#ph-flag", {scale:.96}, {scale:1, duration:.35, ease:"back.out(2)"}, 8.95);

  // La interfaz marca la concentración: los otros tramos se atenúan y vuelven.
  W("#ph-card .bar span").forEach((s, i) => { if (i > 0) tl.to(s, {opacity:.35, duration:.4, ease:"power2.inOut", yoyo:true, repeat:1, repeatDelay:.6}, 9.75); });
  W("#ph-card .legend > div").forEach((r, i) => { if (i > 0) tl.to(r, {opacity:.45, duration:.4, ease:"power2.inOut", yoyo:true, repeat:1, repeatDelay:.6}, 9.75); });

  // Salida: el teléfono acelera hacia abajo.
  tl.to("#ph-wrap", {y:980, duration:.5, ease:"power3.in"}, 11.55);

  window.__timelines["phone"] = tl;
</script>
