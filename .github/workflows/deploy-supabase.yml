# Deploy a producción de Supabase (migraciones + edge functions).
# Corre al mergear a main cambios en supabase/, o a mano (workflow_dispatch).
# El job usa el environment `production`: en GitHub → Settings → Environments
# → production → "Required reviewers" poné tu usuario, así NADA se aplica a
# producción sin tu clic de aprobación. Runbook: docs/runbooks/ci-cd.md
name: Deploy Supabase

on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    name: db push + functions deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Vincular el proyecto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Migraciones pendientes (vista previa)
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Aplicar migraciones
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Desplegar edge functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
