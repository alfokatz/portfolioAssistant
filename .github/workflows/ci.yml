# CI de Porty: en cada PR y en cada push a main, develop o a ramas claude/**.
# - changes: mira qué carpetas tocó el cambio. Lo que no tocó, no se corre
#   (un PR solo de supabase/ no corre Flutter y uno solo de lib/ no levanta
#   Supabase). Push a main/develop y "Run workflow" corren todo.
# - analyze: flutter analyze (falla solo con errores), en su propia máquina.
# - flutter-tests: la suite de Flutter partida en 4 shards en paralelo.
# - supabase: levanta el stack local (aplica TODAS las migraciones: si una no
#   corre, falla acá), corre los tests de Deno de las edge functions y los
#   tests SQL de supabase/tests/.
# - controles (solo PR, observe): reglas de verificación leídas de la rama
#   base (controles en PR aparte, línea Verified: en cada commit).
# - e2e (solo PR con cambios de Flutter, observe): la app web real contra
#   Supabase local con Playwright; sube capturas.
# - ci-ok: un solo check que resume todo (el que conviene marcar como
#   requerido en la protección de ramas; los jobs salteados cuentan como ok).
# Runbook: docs/runbooks/ci-cd.md
name: CI

on:
  pull_request:
  push:
    branches: [main, develop, "claude/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Qué cambió
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      flutter: ${{ steps.all.outputs.run == 'true' || steps.filter.outputs.flutter == 'true' }}
      supabase: ${{ steps.all.outputs.run == 'true' || steps.filter.outputs.supabase == 'true' }}
    steps:
      - name: Push a main/develop o corrida manual corren todo
        id: all
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             || [ "${{ github.ref }}" = "refs/heads/main" ] \
             || [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.all.outputs.run != 'true'
      - uses: dorny/paths-filter@v3
        id: filter
        if: steps.all.outputs.run != 'true'
        with:
          filters: |
            flutter:
              - "lib/**"
              - "test/**"
              - "assets/**"
              - "pubspec.yaml"
              - "pubspec.lock"
              - "analysis_options.yaml"
              - "android/**"
              - "ios/**"
              - "web/**"
              # El test de seguridad del chat compara el prompt con estas listas.
              - "supabase/functions/ai-chat/allowed_*.json"
              - ".github/workflows/ci.yml"
            supabase:
              - "supabase/**"
              - ".github/workflows/ci.yml"

  analyze:
    name: Flutter analyze
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Dependencias
        run: flutter pub get
      - name: Analyze (sin errores; los warnings e infos no frenan)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  flutter-tests:
    name: Flutter tests (shard ${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Que un shard falle no corta los otros: se ven todas las fallas juntas.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Dependencias
        run: flutter pub get
      - name: Tests
        # failures-only: el log muestra solo los tests que fallan (con su error).
        run: >-
          flutter test --reporter failures-only
          --total-shards 4 --shard-index $(( ${{ matrix.shard }} - 1 ))

  supabase:
    name: Supabase (migraciones + Deno + SQL)
    needs: changes
    if: needs.changes.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Compatibilidad de config con la CLI actual
        # La CLI nueva renombró [inbucket] a [local_smtp]. Se adapta solo en el
        # CI para no romper el `supabase start` local con CLIs anteriores.
        run: sed -i 's/^\[inbucket\]$/[local_smtp]/' supabase/config.toml
      - name: Levantar Supabase local (aplica las migraciones)
        run: supabase start -x studio,imgproxy,mailpit,logflare,vector,supavisor
      - name: Variables del stack
        run: |
          supabase status -o env | sed 's/^/export /' > "$RUNNER_TEMP/sb.env"
          source "$RUNNER_TEMP/sb.env"
          {
            echo "API_URL=$API_URL"
            echo "SUPABASE_URL=$API_URL"
            echo "DB_URL=$DB_URL"
            echo "ANON_KEY=$ANON_KEY"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Tests de edge functions (Deno)
        working-directory: supabase/functions
        run: deno test --allow-net --allow-env --allow-read tests/
      - name: Tests SQL
        run: |
          set -euo pipefail
          for f in supabase/tests/*_db_test.sql; do
            echo "::group::$f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
          done
      - name: Apagar Supabase
        if: always()
        run: supabase stop --no-backup

  # Reglas de verificación (tools/verify/check-controls.sh), en modo observe:
  # avisa si el PR toca controles (REVIEW.md, CLAUDE.md, hooks, CI, tests de
  # seguridad, tools/verify) junto con código, y qué commits no dicen cómo se
  # verificaron. Las reglas salen de la rama BASE, no del PR: un cambio no
  # puede aflojar el control que lo juzga. Para que bloquee: CONTROLS_GATE=enforce.
  controles:
    name: Controles (observe)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CONTROLS_GATE: observe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Script y REVIEW.md desde la rama base
        run: |
          git fetch origin "${{ github.base_ref }}" --quiet
          mkdir -p "$RUNNER_TEMP/base"
          if git show "origin/${{ github.base_ref }}:tools/verify/check-controls.sh" > "$RUNNER_TEMP/base/check-controls.sh" 2>/dev/null; then
            echo "Usando check-controls.sh de ${{ github.base_ref }}"
          else
            # Primera vez (todavía no está en la base): se usa el del PR.
            cp tools/verify/check-controls.sh "$RUNNER_TEMP/base/check-controls.sh"
            echo "::notice::check-controls.sh todavía no está en ${{ github.base_ref }}: uso el del PR"
          fi
      - name: Revisar
        run: bash "$RUNNER_TEMP/base/check-controls.sh" --base "${{ github.base_ref }}"

  # E2E real de la app web contra Supabase local (tools/verify/e2e), en modo
  # observe (continue-on-error): reporta y sube capturas, pero todavía no
  # bloquea el merge. Cuando lleve unas semanas estable, sacar continue-on-error
  # y sumarlo a ci-ok.
  e2e:
    name: E2E web (observe)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Dependencias
        run: |
          flutter pub get
          npm install -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
      - name: Flujos E2E
        run: tools/verify/e2e/run.sh
      - name: Capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-capturas
          path: build/e2e/
          if-no-files-found: ignore
      - name: Apagar Supabase
        if: always()
        run: supabase stop --no-backup || true

  ci-ok:
    name: CI ok
    needs: [changes, analyze, flutter-tests, supabase]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Todo lo que corrió pasó
        run: |
          if echo '${{ toJSON(needs.*.result) }}' | grep -qE '"(failure|cancelled)"'; then
            echo "::error::Falló o se canceló un job del CI"
            exit 1
          fi
